<!DOCTYPE html>
<html lang="pl">

<head>
	<meta charset="UTF-8">
	<title>Mój Notatnik</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<div class="top-bar" style="text-align: center;">
		<span class="top-bar-title">Wspólny Notatnik</span>
		<div class="nickname-box">
			<span id="nickname-text"></span>
			<Button id="reset-nickname-btn">Zmień swoją nazwę</Button>
		</div>
	</div>


	<div class="app-container" id="main-view">
		<div class="editor" style="display:none;">
			<div class="editor-container">
				<div id="highlight-layer"></div>
				<textarea name="note-content" id="note-content" placeholder="Tresc notatki"></textarea>
			</div>
			<div class="buttons-grid">
				<Button id="close-note-btn">Zamknij notatke</Button>
				<Button id="delete-note-btn">Usuń notatke</Button>
			</div>
		</div>

		<div class="notes-container">
			<div class="create-note-box">
				<input type="text" id="note-title-input" class="input-field" placeholder="Tytuł notatki...">
				<button id="add-note-btn" class="action-button">Dodaj notatkę</button>
			</div>
			<div class="notes-grid" id="notes-grid">
				<!-- <div class="note-card">
					<div class="note-title">Lista zakupów</div>
					<div class="note-content">
						- Mleko
						- Jajka
						- Chleb tostowy
						- Pomidory
					</div>
					<div class="avatars">
						<div class="avatar" title="Ja">J</div>
					</div>
				</div> -->
			</div>
		</div>
	</div>


	<script>

		let note_id = 0;
		let socket = null;

		const textarea = document.getElementById("note-content");
		const button = document.querySelector("button");

		const notesContainer = document.querySelector(".notes-container");
		const editorContainer = document.querySelector(".editor");

		const closeNoteButton = document.getElementById("close-note-btn");
		const deleteNoteButton = document.getElementById("delete-note-btn");
		const resetNicknameButton = document.getElementById("reset-nickname-btn");
		const addNoteButton = document.getElementById("add-note-btn");
		const noteTitleInput = document.getElementById("note-title-input");

		const nicknameText = document.getElementById("nickname-text");

		let nicknameValue = localStorage.getItem("nickname") || prompt("Podaj swoją nazwę:", "Anonim");
		localStorage.setItem("nickname", nicknameValue);
		nicknameText.textContent = nicknameValue;

		// fetch http://0.0.0.0:8000/api/getNotes and foreach notes-grid
		function fetchNotes() {
			fetch("http://localhost:8000/api/getNotes").then(
				res => {
					const notesGrid = document.getElementById("notes-grid");
					res.json().then(
						data => {
							notesGrid.innerHTML = "";
							data.forEach(note => {
								const noteCard = document.createElement("div");
								noteCard.className = "note-card";
								noteCard.innerHTML = `
								<div class="note-title">${note.name}</div>
								<div class="note-content">${note.content || ""}</div>
								<div class="avatars">
									<div class="avatar" title="${note.author}">${note.author.charAt(0).toUpperCase()}</div>
								</div>
							`;
								noteCard.addEventListener("click", () => {
									if (socket) {
										socket.close();
									}

									console.log(note.id)

									note_id = note.id;
									fetch(`http://localhost:8000/api/getNote/${note_id}`);

									socket = new WebSocket(
										`ws://localhost:8000/ws/editNote/${note_id}`
									);


									socket.onmessage = function (event) {

										const data = JSON.parse(event.data);

										if (data.type === "initial") {

											textarea.value = data.content;

											renderRemoteSelection();

											return;
										}

										if (data.type === "content") {

											const selection = {
												start: textarea.selectionStart,
												end: textarea.selectionEnd,
												direction: textarea.selectionDirection
											};

											textarea.value = data.content;

											textarea.setSelectionRange(
												selection.start,
												selection.end,
												selection.direction
											);

											// Update the remote highlight
											remoteSelection = data.selection;

											renderRemoteSelection();
										}

										else if (data.type === "selection") {

											remoteSelection = data.selection;

											renderRemoteSelection();

										}

									};

									socket.onopen = function () {
										console.log("WebSocket connected");
									};

									socket.onclose = function () {
										console.log("WebSocket disconnected");
									};

									socket.onerror = function (error) {
										console.error("WebSocket error:", error);
									};

									notesContainer.style.display = "none";
									editorContainer.style.display = "block";


								});
								notesGrid.appendChild(noteCard);
							});
						}
					)
				}
			)

		}

		fetchNotes();

		textarea.addEventListener("input", function () {
			console.log(note_id)
			// Update the highlight layer immediately
			renderRemoteSelection();

			if (socket && socket.readyState === WebSocket.OPEN) {

				socket.send(JSON.stringify({
					type: "content",
					content: textarea.value,
					nickname: nicknameValue,
					selection: {
						start: textarea.selectionStart,
						end: textarea.selectionEnd,
						direction: textarea.selectionDirection
					}
				}));

			}

		});

		textarea.addEventListener("select", sendSelection);

		textarea.addEventListener("keyup", sendSelection);

		textarea.addEventListener("mouseup", sendSelection);

		textarea.addEventListener("blur", sendSelection);

		function sendSelection() {
			if (socket && socket.readyState === WebSocket.OPEN) {

				socket.send(JSON.stringify({
					type: "selection",
					nickname: nicknameValue,
					selection: {
						start: textarea.selectionStart,
						end: textarea.selectionEnd,
						direction: textarea.selectionDirection
					}
				}));

			}
		}

		const highlightLayer = document.getElementById("highlight-layer");

		let remoteSelection = null;

		function renderRemoteSelection() {

			const content = textarea.value;

			highlightLayer.replaceChildren();

			if (!remoteSelection) {
				highlightLayer.textContent = content;
				return;
			}

			const start = Math.max(
				0,
				Math.min(remoteSelection.start, content.length)
			);

			const end = Math.max(
				start,
				Math.min(remoteSelection.end, content.length)
			);

			const before = content.slice(0, start);
			const selected = content.slice(start, end);
			const after = content.slice(end);

			highlightLayer.appendChild(
				document.createTextNode(before)
			);

			if (selected.length > 0) {
				const mark = document.createElement("mark");
				mark.textContent = selected;
				highlightLayer.appendChild(mark);
			}

			highlightLayer.appendChild(
				document.createTextNode(after)
			);
		}

		closeNoteButton.addEventListener("click", () => {
			if (socket) {
				socket.close();
			}
			note_id = 0;
			editorContainer.style.display = "none";
			notesContainer.style.display = "block";
		});

		deleteNoteButton.addEventListener("click", () => {
			fetch(`http://localhost:8000/api/deleteNote?note_id=${note_id}`, { method: "POST" }).then(() => {
				if (socket) {
					socket.close();
				}
				note_id = 0;
				editorContainer.style.display = "none";
				notesContainer.style.display = "block";
				fetchNotes();
			});
		});

		addNoteButton.addEventListener("click", () => {
			const name = noteTitleInput.value.trim();
			if (name) {
				fetch(`http://localhost:8000/api/addNote`, {
					method: "POST",
					headers: {
						"Content-Type": "application/json"
					},
					body: JSON.stringify({ name: name, author: nicknameValue })

				}).then(() => {
					noteTitleInput.value = "";
					fetchNotes();
				});
			}
		});

		resetNicknameButton.addEventListener("click", () => {
			localStorage.removeItem("nickname");
			const newNickname = prompt("Podaj swoją nazwę:", "Anonim");
			if (newNickname) {
				localStorage.setItem("nickname", newNickname);
				alert(`Twoja nowa nazwa to: ${newNickname}`);
			}
			nicknameValue = newNickname;
			nicknameText.textContent = newNickname;
			location.reload();
		});

	</script>
</body>

</html>
